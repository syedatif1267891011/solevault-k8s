apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solevault-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: solevault.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solevault-service
                port:
                  number: 80
